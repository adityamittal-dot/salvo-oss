# What gets scanned. Two lists, same entry contract.
#
# `job_boards:`       one entry per aggregator/feed (many employers)
# `tracked_companies:` one entry per employer, resolved by ATS slug
#
# The slugs below are a SEED LIST and are not all guaranteed live — ATS slugs
# change and boards get retired. Run `node verify-boards.mjs` to probe every
# entry and print which are alive, empty, or 404. Prune from there.

job_boards:
  - name: RemoteOK
    provider: remoteok

  - name: Remotive
    provider: remotive
    category: software-dev

  - name: HN Who Is Hiring
    provider: hn-hiring

  # Community-maintained lists on GitHub. Structured JSON, links go straight to
  # the employer's own application page.
  - name: Simplify Internships 2027
    provider: simplify-github
    repo: internships-2027

  - name: Simplify New Grad
    provider: simplify-github
    repo: new-grad

  # India-market internships/entry-level jobs — public search API, no login
  # (robots.txt explicitly allows /api/public/*). Paid-only filtering happens
  # inside the provider itself.
  - name: Unstop (India)
    provider: unstop

